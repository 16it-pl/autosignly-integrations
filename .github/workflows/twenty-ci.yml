name: twenty app CI

on:
  push:
    branches: [main]
    paths: ['packages/twenty/**', '.github/workflows/twenty-ci.yml']
  pull_request:
    paths: ['packages/twenty/**', '.github/workflows/twenty-ci.yml']

concurrency:
  group: twenty-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/twenty

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/twenty/.nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit
